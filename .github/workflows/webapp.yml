name: Flight Lab Web QA

on:
  push:
    branches: [main, webapp-foundation]
  pull_request:
    branches: [main]

jobs:
  webapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Unit and integration QA
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit chrome msedge
      - name: Browser and device E2E QA
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          if-no-files-found: ignore
      - name: Upload E2E failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: web/test-results/
          if-no-files-found: ignore
